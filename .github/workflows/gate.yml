name: gate
# Soon after a session PR is validated, plus the hourly backstop (decision 0025). GitHub's scheduler skips cron runs
# under load (gaps of 6-8 h were measured, 2026-10-20..28); merges and the meta-learner's counts waited on them.
# workflow_run always runs this file as it is on main, with main's token, whatever the PR changed: the PR only says
# "look now". Every conclusion counts (no job-level if): the gate re-validates every PR itself, a failed validate is
# closed sooner, and a run skipped at job level would still take the concurrency slot below and could displace a
# pending run that had work to do. Nothing from github.event.workflow_run (a PR's branch or title) is used: the run
# reads the open PRs itself.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [validate]
    types: [completed]
  workflow_dispatch:
# Nothing by default; each job asks for exactly what it needs.
permissions: {}
# One run at a time (its merges and data/meta commit never race each other), and at most one waiting: a newer trigger
# replaces the waiting run, which is all it would have done anyway, since every run decides every open PR. A burst of
# validations therefore queues one run, not one per push.
concurrency:
  group: gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    # Each PR fetch is bounded (120 s, 64 MiB; one over either is labelled needs-human and not fetched again), so a run
    # is short; this caps a run that is not.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
      meta: ${{ steps.meta.outputs.meta }}
    steps:
      # Full history: a learner belongs to the author of the PR that first put its logs on main (github.ts boundAuthor).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # What was installed: commit-meta.ts refuses to commit if main's lockfile has moved past it (meta-cli would have
      # run main's new code on this older install).
      - run: echo "LOCK_BLOB=$(git hash-object package-lock.json)" >> "$GITHUB_ENV"
      - id: gate
        run: npx tsx tools/gate/gate.ts data/runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      # data/meta/** is built from main as it now is: the gate's merges, and the code, config and logs they brought.
      - run: git pull --ff-only origin main
      # Fail before running main's new code on an older install (commit-meta.ts checks again before every commit).
      - run: '[ "$(git rev-parse HEAD:package-lock.json)" = "$LOCK_BLOB" ] || { echo "::error::main changed package-lock.json since npm ci; the next run reinstalls"; exit 1; }'
      - run: npx tsx tools/gate/meta-cli.ts
      # The one direct commit to main (decision 0019): only the files meta-cli.ts computed, never forced; on a push that
      # main moved past, it resets to the new main and rebuilds.
      - id: meta
        run: npx tsx tools/gate/commit-meta.ts
  # Merges and pushes made with GITHUB_TOKEN do not trigger other workflows, so the gate calls deploy itself: after a
  # merge, or after a data/meta commit (decision 0019). meta == 'committed' covers a promotion too: its commit carries
  # knowledge/genome.json, which deploy.yml copies with knowledge/*.json, so the deployed knowledgeSha changes by
  # design (0019) and open tabs reload onto the new centre (0014).
  deploy:
    needs: gate
    if: ${{ !cancelled() && ((needs.gate.outputs.merged != '' && needs.gate.outputs.merged != '0') || needs.gate.outputs.meta == 'committed') }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
