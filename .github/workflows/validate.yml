name: validate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: read
# A tab commits to its PR's branch again and again; only the newest head matters.
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: "${{ startsWith(github.event.pull_request.title, 'run: ') }}"
    runs-on: ubuntu-latest
    steps:
      # Checks out main's scripts rather than the PR's merge ref, so session data is never executed. But under
      # pull_request a PR that edits this workflow file runs its own version of it: this check proves nothing
      # about a PR that touches code, and humans must not trust it there. The enforcement is the gate, which
      # runs from main (when this workflow completes, and hourly) and re-validates every PR itself before merging.
      # This run's outcome is not an input to it (decision 0025).
      # Full history: the PR's files are the diff from its merge base with main (github.ts loadPrViaGit).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx tools/gate/validate-cli.ts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
